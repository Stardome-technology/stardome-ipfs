# ── Minimal SEAD auth stack for IPFS VPS ──────────────────────────────────
# Usage:
#   docker compose -f docker-compose.ipfs-auth.yml up -d
#
# Bootstrap:
#   1. Register OrgGenesis event:
#      curl -X POST http://localhost:30080/events \
#        -H "Content-Type: application/cbor" \
#        --data-binary @org_genesis.cbor
#   2. Register EdgeAuthorization:
#      curl -X POST http://localhost:30080/events \
#        -H "Content-Type: application/cbor" \
#        --data-binary @edge_auth.cbor
#   3. Verify: curl http://localhost:30080/orgs/<org_id_hex>
#
# Go Gateway migration phase 4.4: sead-core is gRPC-only (no public HTTP port). The gateway is the
# single entry point: it serves /auth/verify (collapsed from auth-service) and
# proxies /events, /orgs/{id} to sead-core over gRPC. The gateway listens on
# 127.0.0.1:30080 — Nginx is the public entry (443) and proxies auth_request
# to it. The pin-replicator runs with host networking to reach Kubo on
# 127.0.0.1:5001.

services:
  sead-core:
    image: ghcr.io/stardome-technology/stardome-sead/sead-core:latest
    # No public ports — gRPC-only, reachable on sead-network via the gateway
    volumes:
      - sead_data:/data
    environment:
      - LOG_LEVEL=info
      - SERVICE_NAME=sead-core
    command: ["sead-core", "--port", "50051", "--db", "/data/sead.db", "--fake-verification"]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  gateway:
    image: ghcr.io/stardome-technology/stardome-sead-gateway:latest
    ports:
      - "127.0.0.1:30080:30080"
    environment:
      # No GATEWAY_AUTH_SECRET is set here BY DESIGN: the bearer layer is left
      # open so Nginx can be the public entry (443) and enforce auth via
      # auth_request -> gateway /auth/verify using a CBOR auth token (org
      # XMSS-signed). Cross-org trust comes from the SEAD DAG (org/edge
      # authorization events), not a shared transport token.
      - GATEWAY_TLS_ENABLED=false
      - GATEWAY_AUTH_ENABLED=true
      - GATEWAY_AUTH_CBOR_ENABLED=true
      - GATEWAY_AUTH_CBOR_CACHE_TTL=60
      - GATEWAY_AUTH_CBOR_SKEW_TOLERANCE=30
      - GATEWAY_METRICS_ENABLED=false
      - SVC_SEAD_CORE_GRPC=sead-core:50051
      - SVC_SEAD_CORE=http://sead-core:50051
      - GATEWAY_GRPC_PORT=50054
      # This minimal stack runs only sead-core; probe just it so /health
      # reports healthy instead of degraded for the absent edge/storage/source-data.
      - GATEWAY_HEALTH_BACKENDS=sead-core
    depends_on:
      sead-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:30080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sead-network

  # ── Pin Replicator ──────────────────────────────────────────────────────
  # Connects to the host IPFS daemon (Kubo, bound to 127.0.0.1:5001) and
  # establishes bilateral replication agreements. Runs with host networking
  # so it reaches the host's loopback API directly — the bridge network's
  # host.docker.internal (172.17.0.1) cannot reach IPFS, which binds
  # loopback-only (/ip4/127.0.0.1/tcp/5001).
  pin-replicator:
    image: ghcr.io/stardome-technology/stardome-sead/pin-replicator:latest
    network_mode: host
    volumes:
      - sead_data:/data
    environment:
      - LOG_LEVEL=info
      - IPFS_API_URL=http://127.0.0.1:5001
    command: ["--port", "32001",
              "--db", "/data/pin-replicator.db",
              "--ipfs-api-url", "http://127.0.0.1:5001",
              "--poll-interval", "30s",
              "--verify-interval", "5m"]

volumes:
  sead_data:

networks:
  sead-network:
    name: sead-network
    driver: bridge